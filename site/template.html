<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comex em Números</title>
<meta name="description" content="Exportações e importações do Brasil mês a mês, por produto, país e estado, com dados oficiais do Comex Stat (Secex/MDIC).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho fixo + coluna única no celular, grade de 2–4 colunas no desktop.
   Exportação = verde-petróleo, importação = âmbar, em todas as páginas. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#0f1d2b; --muted:#566879; --line:#d6dee5;
  --exp:#0b7a68; --imp:#b9660f; --up:#17803a; --down:#b42318; --chip:#e3eaef;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b131b; --surface:#121e29; --ink:#e5ecf2; --muted:#93a5b6; --line:#243443;
    --exp:#37c0a5; --imp:#f0a04a; --up:#4cc774; --down:#ff7a6b; --chip:#1b2a37; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b131b; --surface:#121e29; --ink:#e5ecf2; --muted:#93a5b6; --line:#243443;
  --exp:#37c0a5; --imp:#f0a04a; --up:#4cc774; --down:#ff7a6b; --chip:#1b2a37; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--exp)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--exp);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:700}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-size:1.2rem;font-weight:700}
.brand b span{color:var(--exp)}
nav.main{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:500;font-size:.92rem;padding:6px 10px;border-radius:6px}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--chip)}
.info-bar{background:var(--chip);border-bottom:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.info-bar div{max-width:1080px;margin:0 auto;padding:8px 16px}
.info-bar strong{color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;min-width:0}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.04rem;max-width:68ch}
.lede strong{font-weight:600}
.small{font-size:.85rem;color:var(--muted)}
.src{font-size:.8rem;color:var(--muted)}
.row-head{display:flex;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;align-items:baseline}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:4px;border-top:4px solid var(--line);text-decoration:none;color:inherit;min-width:0}
.tile.exp{border-top-color:var(--exp)} .tile.imp{border-top-color:var(--imp)} .tile.bal{border-top-color:var(--ink)}
.tile .lbl{font-size:.82rem;color:var(--muted);font-weight:500}
.tile .val{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .val small{font-size:.9rem;font-weight:500;color:var(--muted)}
.chg{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;width:fit-content}
.chg.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.chg.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.chg.flat{color:var(--muted);background:var(--chip)}
.two{display:grid;gap:20px}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);fill:var(--muted);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
td.n{color:var(--muted);font-variant-numeric:tabular-nums;width:1.5em}
td .s{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
td a{text-decoration:none;font-weight:500}
td a:hover{text-decoration:underline}
.scroll{overflow-x:auto}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:.86rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.hbar .t{font-weight:500}
.hbar .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hbar .track{grid-column:1 / -1;height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.hbar .track span{display:block;height:100%;border-radius:5px}
.hbar .meta{grid-column:1 / -1;display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.note{border-left:3px solid var(--imp);padding:8px 12px;background:color-mix(in srgb,var(--imp) 8%,transparent);border-radius:0 6px 6px 0;font-size:.9rem}
.cta{display:grid;gap:20px}
@media (min-width:860px){.cta{grid-template-columns:1fr 1fr}}
button.btn{font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--exp);background:var(--exp);color:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;width:fit-content}
button.btn.ghost{background:transparent;color:var(--exp)}
code.embed{display:block;font-size:.78rem;background:var(--chip);padding:10px;border-radius:6px;overflow-x:auto;white-space:pre;color:var(--ink)}
form.nl{display:flex;gap:8px;flex-wrap:wrap}
form.nl input{flex:1 1 200px;font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.msg{font-size:.86rem;color:var(--muted);min-height:1.2em}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
.search{display:flex;gap:8px}
.search input{flex:1;font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer div{max-width:1080px;margin:0 auto;padding:16px;font-size:.82rem;color:var(--muted);display:grid;gap:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#inicio" aria-label="Comex em Números, início">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/><rect x="6" y="13" width="4" height="9" rx="1" fill="var(--exp)"/><rect x="12" y="8" width="4" height="14" rx="1" fill="var(--exp)"/><rect x="18" y="11" width="4" height="11" rx="1" fill="var(--imp)"/></svg>
      <b>Comex <span>em Números</span></b>
    </a>
    <nav class="main" aria-label="Seções">
      <a href="#inicio" data-v="inicio">Início</a>
      <a href="#exportacao" data-v="exportacao">Exportação</a>
      <a href="#importacao" data-v="importacao">Importação</a>
      <a href="#paises" data-v="paises">Países</a>
      <a href="#estados" data-v="estados">Estados</a>
      <a href="#sobre" data-v="sobre">Como funciona</a>
    </nav>
  </div>
</header>
<div class="info-bar"><div id="info-bar"></div></div>
<main id="app"></main>
<footer><div>
  <span><strong>Comex em Números</strong> · versão beta</span>
  <span id="rodape"></span>
</div></footer>

<script id="dados" type="application/json">/*__DADOS__*/</script>
<script>
(function(){
"use strict";
var D;
try{ D=JSON.parse(document.getElementById("dados").textContent); }catch(e){ D=null; }
var app=document.getElementById("app");
if(!D||!D.mes){
  app.innerHTML='<div class="card"><h1>Dados em atualização</h1><p>O robô ainda não terminou de buscar os dados do Comex Stat. Volte em alguns minutos.</p></div>';
  return;
}

// ---------- utilidades ----------
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MES_CURTO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function nf(v,d){return v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function mesNome(m){var p=m.split("-");return MESES[+p[1]-1]+" de "+p[0];}
function mesCurto(m){var p=m.split("-");return MES_CURTO[+p[1]-1]+"/"+p[0].slice(2);}
function us(v){
  var a=Math.abs(v), s=v<0?"−":"";
  if(a>=1e9) return s+"US$ "+nf(a/1e9,2)+" bi";
  if(a>=1e6) return s+"US$ "+nf(a/1e6,a>=1e8?0:1)+" mi";
  if(a>=1e3) return s+"US$ "+nf(a/1e3,0)+" mil";
  return s+"US$ "+nf(a,0);
}
function bi(v){return nf(v/1e9,2);}
function pct(a,b){ if(!b) return null; return (a/b-1)*100; }
function chip(a,b,inv){
  if(!b&&a>0) return '<span class="chg up">novo</span>';
  if(!b) return '<span class="chg flat">—</span>';
  var p=pct(a,b), up=p>=0, cls=(inv?!up:up)?"up":"down";
  if(Math.abs(p)<0.05) return '<span class="chg flat">0,0%</span>';
  var txt=Math.abs(p)>=1000?nf(Math.abs(p),0):nf(Math.abs(p),1);
  return '<span class="chg '+cls+'">'+(up?"▲ ":"▼ ")+txt+'%</span>';
}
function slug(t){return String(t).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase().slice(0,60)||"item";}
function minusc(s){return s.charAt(0).toLowerCase()+s.slice(1);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function nomeCurto(n,max){n=String(n);max=max||70;return n.length>max?n.slice(0,max-1)+"…":n;}

var REF=D.mes, ANT=D.mes_ant;
function serie(fl){return D.mensal[fl]||[];}
function totMes(fl,m){var x=serie(fl).filter(function(r){return r.mes===m;})[0];return x?x.fob:0;}
var EXP=totMes("export",REF), EXP0=totMes("export",ANT), IMP=totMes("import",REF), IMP0=totMes("import",ANT);
function lista(k,fl){return (D[k]&&D[k][fl])||[];}
function fluxoNome(fl){return fl==="export"?"exportação":"importação";}

document.getElementById("info-bar").innerHTML='<strong>Dados de '+mesNome(REF)+'.</strong> Fonte: Comex Stat (Secex/MDIC), atualizado automaticamente em '+new Date(D.gerado_em).toLocaleDateString("pt-BR")+'.';
document.getElementById("rodape").textContent="Fonte: Comex Stat, Secex/MDIC. Valores em US$ FOB. Variações sempre contra o mesmo mês do ano anterior ("+mesNome(ANT)+"). Por estado, vale a UF de origem do produto exportado ou de destino do importado.";

// ---------- gráficos ----------
var NS="http://www.w3.org/2000/svg";
function el(t,a,x){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e;}
function grafMensal(box){
  var ms=[];var p=REF.split("-"),y=+p[0],m=+p[1];
  for(var i=12;i>=0;i--){var yy=y,mm=m-i;while(mm<=0){mm+=12;yy--;}ms.push(yy+"-"+(mm<10?"0":"")+mm);}
  var rows=ms.map(function(k){return [k,totMes("export",k),totMes("import",k)];});
  var mx=Math.max.apply(null,rows.map(function(r){return Math.max(r[1],r[2]);}))/1e9;
  var top=Math.ceil(mx/10)*10||10, ticks=[];for(var t=0;t<=top;t+=10)ticks.push(t);
  var cw=box.clientWidth||640, W=Math.max(340,Math.min(700,cw)), H=W<500?250:290, L=28,R=4,T=16,B=56;
  var svg=el("svg",{viewBox:"0 0 "+W+" "+H}), ih=H-T-B, iw=W-L-R, step=iw/rows.length, bw=step*0.34;
  ticks.forEach(function(g){var yy=T+ih-(g/top)*ih;svg.appendChild(el("line",{x1:L,x2:W-R,y1:yy,y2:yy,stroke:"var(--line)"}));svg.appendChild(el("text",{x:L-5,y:yy+4,"text-anchor":"end"},String(g)));});
  rows.forEach(function(r,i){
    var x0=L+i*step+step/2, hi=(i===rows.length-1||i===0), op=hi?1:0.6;
    [[r[1],"var(--exp)",-bw-1,"exportação"],[r[2],"var(--imp)",1,"importação"]].forEach(function(b){
      var h=(b[0]/1e9/top)*ih, rc=el("rect",{x:x0+b[2],y:T+ih-h,width:bw,height:h,rx:2,fill:b[1],opacity:op});
      rc.appendChild(el("title",{},mesCurto(r[0])+": "+b[3]+" "+us(b[0])));svg.appendChild(rc);
    });
    var lb=el("text",{x:x0,y:T+ih+15,"text-anchor":"middle"},MES_CURTO[+r[0].slice(5)-1]);
    if(hi)lb.setAttribute("style","fill:var(--ink);font-weight:600");svg.appendChild(lb);
    var sd=el("text",{x:x0,y:T+ih+38,"text-anchor":"middle"},nf((r[1]-r[2])/1e9,1));
    sd.setAttribute("style","font-size:10px;fill:"+(hi?"var(--ink)":"var(--muted)")+";font-weight:"+(hi?"700":"400"));svg.appendChild(sd);
  });
  svg.appendChild(el("text",{x:2,y:T+ih+38},"saldo"));
  box.appendChild(svg);
}
function grafPar(box,rotulos,pares,unid){
  // pares: [[valor_ant, valor_atual, cor]...] por série
  var cw=box.clientWidth||520, W=Math.max(320,Math.min(560,cw)), H=200, L=8,R=8,T=20,B=28;
  var mx=0;pares.forEach(function(p){mx=Math.max(mx,p[0],p[1]);});mx=mx||1;
  var svg=el("svg",{viewBox:"0 0 "+W+" "+H}), ih=H-T-B, iw=W-L-R, step=iw/2, bw=Math.min(56,step/(pares.length+1));
  [0,1].forEach(function(j){
    var x0=L+j*step+step/2, tot=pares.length*bw+(pares.length-1)*4, xs=x0-tot/2;
    pares.forEach(function(p,i){
      var v=p[j], h=(v/mx)*ih, x=xs+i*(bw+4);
      svg.appendChild(el("rect",{x:x,y:T+ih-h,width:bw,height:Math.max(h,0.5),rx:2,fill:p[2],opacity:j?1:0.55}));
      var t=el("text",{x:x+bw/2,y:T+ih-h-5,"text-anchor":"middle"},unid(v));t.setAttribute("style","fill:var(--ink);font-weight:600;font-size:10.5px");svg.appendChild(t);
    });
    svg.appendChild(el("text",{x:x0,y:T+ih+18,"text-anchor":"middle"},rotulos[j]));
  });
  svg.appendChild(el("line",{x1:L,x2:W-R,y1:T+ih,y2:T+ih,stroke:"var(--line)"}));
  box.appendChild(svg);
}

// ---------- pedaços de página ----------
function tile(cls,lbl,val,unid,chg,href){
  var tag=href?'a':'div', h=href?' href="'+href+'"':'';
  return '<'+tag+' class="tile '+cls+'"'+h+'><span class="lbl">'+lbl+(href?' →':'')+'</span><span class="val">'+val+(unid?' <small>'+unid+'</small>':'')+'</span>'+chg+'</'+tag+'>';
}
function hbars(rows,cor){
  var mx=Math.max.apply(null,rows.map(function(r){return r.fob;}))||1;
  return '<div class="hbars">'+rows.map(function(r){
    return '<div class="hbar"><span class="t">'+esc(nomeCurto(r.curto||r.nome,60))+'</span><span class="v">'+us(r.fob)+'</span><span class="track"><span style="width:'+(r.fob/mx*100)+'%;background:'+cor+'"></span></span><span class="meta">'+chip(r.fob,r.fob_ant)+'<span>antes: '+us(r.fob_ant)+'</span></span></div>';
  }).join("")+'</div>';
}
function hrefItem(tipo,r){return "#"+tipo+"-"+(tipo==="produto"?slug(r.codigo):slug(r.nome));}
function tabela(rows,tipo,total,modo){
  var h='<div class="scroll"><table><thead><tr><th></th><th>'+(tipo==="produto"?"Produto":tipo==="pais"?"País":"Estado")+'</th><th class="r">'+cap(MES_CURTO[+REF.slice(5)-1])+'/'+REF.slice(2,4)+'</th><th class="r">'+(modo==="valor"?"Var.":"Diferença")+'</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var sub=modo==="valor"?(total?nf(r.fob/total*100,1)+"% do total":""):(chip(r.fob,r.fob_ant)+" · antes "+us(r.fob_ant));
    var col=modo==="valor"?chip(r.fob,r.fob_ant):'<span class="chg '+(r.fob>=r.fob_ant?"up":"down")+'">'+(r.fob>=r.fob_ant?"+":"")+us(r.fob-r.fob_ant).replace("US$ ","")+'</span>';
    h+='<tr><td class="n">'+(i+1)+'</td><td><a href="'+hrefItem(tipo,r)+'">'+esc(nomeCurto(r.curto||r.nome))+'</a><span class="s">'+(tipo==="produto"?"SH4 "+esc(r.codigo)+" · ":"")+sub+'</span></td><td class="r">'+us(r.fob)+'</td><td class="r">'+col+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function altas(rows,minimo){return rows.filter(function(r){return Math.max(r.fob,r.fob_ant)>=minimo&&r.fob>r.fob_ant;}).sort(function(a,b){return (b.fob-b.fob_ant)-(a.fob-a.fob_ant);});}
function quedas(rows,minimo){return rows.filter(function(r){return Math.max(r.fob,r.fob_ant)>=minimo&&r.fob<r.fob_ant;}).sort(function(a,b){return (a.fob-a.fob_ant)-(b.fob-b.fob_ant);});}
function resumoFluxo(fl){
  var tot=fl==="export"?EXP:IMP, tot0=fl==="export"?EXP0:IMP0, dif=tot-tot0, ps=lista("produtos",fl);
  var a=altas(ps,1e7), q=quedas(ps,1e7), verbo=dif>=0?(fl==="export"?"exportou":"importou"):(fl==="export"?"exportou":"importou");
  var p=pct(tot,tot0), txt='O Brasil '+verbo+' <strong class="num">'+us(tot)+'</strong> em '+mesNome(REF)+', '+(p>=0?'alta':'queda')+' de <strong>'+nf(Math.abs(p),1)+'%</strong> sobre '+MESES[+ANT.slice(5)-1]+' do ano passado.';
  var lider=dif>=0?a[0]:q[0];
  if(lider&&Math.abs(dif)>0){
    var c=(lider.fob-lider.fob_ant), share=Math.abs(c/dif*100);
    txt+=' '+(dif>=0?'O maior impulso veio de ':'A maior queda veio de ')+'<strong>'+esc(minusc(nomeCurto(lider.curto||lider.nome,60)))+'</strong> ('+(c>=0?'+':'')+us(c)+(share<=150?', '+nf(share,0)+'% da variação total':'')+').';
  }
  var contra=dif>=0?q[0]:a[0];
  if(contra){txt+=' No sentido contrário, '+(dif>=0?'caiu':'subiu')+' '+esc(minusc(nomeCurto(contra.curto||contra.nome,60)))+' ('+(contra.fob-contra.fob_ant>=0?'+':'')+us(contra.fob-contra.fob_ant)+').';}
  return txt;
}

// ---------- páginas ----------
var V={};
V.inicio=function(){
  var saldo=EXP-IMP, saldo0=EXP0-IMP0, pE=pct(EXP,EXP0), pI=pct(IMP,IMP0);
  var titulo=(pE>=0?"Exportações sobem ":"Exportações caem ")+nf(Math.abs(pE),1)+"% em "+MESES[+REF.slice(5)-1]+(saldo>=0?" e saldo chega a "+us(saldo):" e balança fica negativa em "+us(-saldo));
  var acE=D.acumulado.export, acI=D.acumulado.import;
  var mx=altas(lista("produtos","export"),2e7).slice(0,5);
  var h='<div class="card"><span class="eyebrow">Balança comercial · '+mesNome(REF)+'</span><h1>'+esc(titulo)+'</h1>'+
   '<p class="lede">'+resumoFluxo("export")+'</p><p class="lede">Nas importações, o país comprou <strong class="num">'+us(IMP)+'</strong> ('+(pI>=0?'+':'−')+nf(Math.abs(pI),1)+'%). O saldo do mês foi de <strong class="num">'+us(saldo)+'</strong>, contra '+us(saldo0)+' um ano antes.</p>'+
   '<p class="src">Resumo gerado automaticamente com os dados do Comex Stat.</p></div>';
  h+='<div class="tiles">'+tile("exp","Exportações",bi(EXP),"US$ bi",chip(EXP,EXP0),"#exportacao")+tile("imp","Importações",bi(IMP),"US$ bi",chip(IMP,IMP0),"#importacao")+
     tile("bal","Saldo",bi(saldo),"US$ bi",saldo0>0?chip(saldo,saldo0):'<span class="chg flat">antes '+bi(saldo0)+'</span>')+tile("","Corrente de comércio",bi(EXP+IMP),"US$ bi",chip(EXP+IMP,EXP0+IMP0))+'</div>';
  h+='<div class="two"><div class="card"><div class="row-head"><h2>Últimos 13 meses</h2><div class="legend"><span><i style="background:var(--exp)"></i>Exportação</span><span><i style="background:var(--imp)"></i>Importação</span></div></div><div class="chart" id="g-mensal" role="img" aria-label="Exportações e importações mensais do Brasil nos últimos 13 meses"></div><p class="src">US$ bilhões FOB. Linha de baixo: saldo do mês. Em destaque, o mês atual e o mesmo mês do ano anterior.</p></div>'+
     '<div class="card"><h2>Acumulado no ano</h2><table><thead><tr><th>Jan–'+MES_CURTO[+REF.slice(5)-1]+'/'+REF.slice(0,4)+'</th><th class="r">US$ bi</th><th class="r">vs '+ANT.slice(0,4)+'</th></tr></thead><tbody>'+
     '<tr><td>Exportações</td><td class="r">'+bi(acE.fob)+'</td><td class="r">'+chip(acE.fob,acE.fob_ant)+'</td></tr><tr><td>Importações</td><td class="r">'+bi(acI.fob)+'</td><td class="r">'+chip(acI.fob,acI.fob_ant)+'</td></tr>'+
     '<tr><td><strong>Saldo</strong></td><td class="r"><strong>'+bi(acE.fob-acI.fob)+'</strong></td><td class="r">'+((acE.fob_ant-acI.fob_ant)>0?chip(acE.fob-acI.fob,acE.fob_ant-acI.fob_ant):"")+'</td></tr></tbody></table></div></div>';
  h+='<div class="two"><div class="card"><div class="row-head"><h2>O que mais puxou as exportações</h2><a class="small" href="#exportacao">Ver todos →</a></div><p class="small">Maiores aumentos em US$ contra '+mesNome(ANT)+'.</p>'+tabela(mx,"produto",EXP,"dif")+'</div>'+
     '<div class="card"><h2>Exportações por setor</h2>'+hbars(lista("setores","export").filter(function(r){return r.fob>0;}),"var(--exp)")+'</div></div>';
  var pe=lista("paises","export").slice(0,6), ue=lista("estados","export").slice(0,6);
  h+='<div class="two"><div class="card"><div class="row-head"><h2>Principais destinos</h2><a class="small" href="#paises">Todos os países →</a></div>'+tabela(pe,"pais",EXP,"valor")+'</div>'+
     '<div class="card"><div class="row-head"><h2>Estados que mais exportam</h2><a class="small" href="#estados">Todos →</a></div>'+tabela(ue,"estado",EXP,"valor")+'</div></div>';
  h+='<div class="cta"><div class="card"><h3>Jornalista? Use este gráfico na sua matéria</h3><p class="small">Cole o código na sua página. O gráfico se atualiza sozinho todo mês e traz o crédito para o Comex em Números.</p><code class="embed" id="embed-code">&lt;iframe src="https://comexemnumeros.com.br/embed/balanca-mensal"\n  width="100%" height="380" frameborder="0"&gt;&lt;/iframe&gt;</code><button type="button" class="btn ghost" id="copy-embed">Copiar código</button><span class="msg" id="copy-msg" aria-live="polite"></span></div>'+
     '<div class="card"><h3>A balança do mês em 2 minutos</h3><p class="small">Um e-mail por mês, no dia em que os dados saem: o que subiu, o que caiu e por quê.</p><form class="nl" id="nl-form"><label for="nl-email" class="small" style="flex-basis:100%">Seu e-mail</label><input id="nl-email" type="email" placeholder="nome@empresa.com.br" required><button type="submit" class="btn">Quero receber</button></form><span class="msg" id="nl-msg" aria-live="polite"></span></div></div>';
  app.innerHTML=h;
  grafMensal(document.getElementById("g-mensal"));
  document.getElementById("copy-embed").addEventListener("click",function(){
    var code=document.getElementById("embed-code").textContent,msg=document.getElementById("copy-msg");
    try{navigator.clipboard.writeText(code).then(function(){msg.textContent="Código copiado.";},function(){msg.textContent="Não deu para copiar aqui. Selecione o código e copie manualmente.";});}catch(e){msg.textContent="Não deu para copiar aqui. Selecione o código e copie manualmente.";}
  });
  document.getElementById("nl-form").addEventListener("submit",function(e){e.preventDefault();document.getElementById("nl-msg").textContent="A newsletter ainda não está ligada. Nenhum e-mail foi salvo.";});
};

function paginaFluxo(fl){
  var tot=fl==="export"?EXP:IMP, tot0=fl==="export"?EXP0:IMP0, ps=lista("produtos",fl).filter(function(r){return r.fob>0||r.fob_ant>0;});
  var cor=fl==="export"?"var(--exp)":"var(--imp)", cls=fl==="export"?"exp":"imp";
  var grupos=fl==="export"?lista("setores",fl):lista("categorias",fl);
  grupos=grupos.filter(function(r){return r.fob>0;});
  var h='<div class="card"><span class="eyebrow">'+cap(fluxoNome(fl))+' · '+mesNome(REF)+'</span><h1>'+(fl==="export"?"O que o Brasil vendeu":"O que o Brasil comprou")+' em '+MESES[+REF.slice(5)-1]+'</h1><p class="lede">'+resumoFluxo(fl)+'</p></div>';
  var g3=grupos.slice(0,3);
  h+='<div class="tiles">'+tile(cls,"Total "+(fl==="export"?"exportado":"importado"),bi(tot),"US$ bi",chip(tot,tot0))+g3.map(function(r){return tile("",esc(nomeCurto(r.curto||r.nome,34)),bi(r.fob),"US$ bi",chip(r.fob,r.fob_ant));}).join("")+'</div>';
  h+='<div class="card"><div class="row-head"><h2>Produtos</h2><div class="seg" role="group" aria-label="Ordenar produtos"><button type="button" data-m="valor" aria-pressed="true">Maior valor</button><button type="button" data-m="altas" aria-pressed="false">Maiores altas</button><button type="button" data-m="quedas" aria-pressed="false">Maiores quedas</button></div></div><p class="small" id="p-desc"></p><div id="p-tab"></div>'+
     '<div class="search"><label for="busca" class="small" style="align-self:center">Buscar</label><input id="busca" type="search" placeholder="Ex.: café, soja, aço, medicamentos"></div><div id="p-busca"></div></div>';
  h+='<div class="two"><div class="card"><h2>'+(fl==="export"?"Por setor":"Por tipo de bem")+'</h2>'+hbars(grupos,cor)+'</div>'+
     '<div class="card"><div class="row-head"><h2>'+(fl==="export"?"Principais destinos":"Principais origens")+'</h2><a class="small" href="#paises">Todos →</a></div>'+tabela(lista("paises",fl).slice(0,8),"pais",tot,"valor")+'</div></div>';
  h+='<div class="card"><div class="row-head"><h2>'+(fl==="export"?"Estados que mais exportam":"Estados que mais importam")+'</h2><a class="small" href="#estados">Todos →</a></div>'+tabela(lista("estados",fl).slice(0,8),"estado",tot,"valor")+'</div>';
  app.innerHTML=h;
  var modos={
    valor:[function(){return ps.slice(0,20);},"Os 20 produtos de maior valor no mês (classificação SH4).","valor"],
    altas:[function(){return altas(ps,1e7).slice(0,20);},"Maiores aumentos em US$ contra "+mesNome(ANT)+" (produtos acima de US$ 10 mi).","dif"],
    quedas:[function(){return quedas(ps,1e7).slice(0,20);},"Maiores quedas em US$ contra "+mesNome(ANT)+" (produtos acima de US$ 10 mi).","dif"]
  };
  function mostra(m){
    document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===m?"true":"false");});
    document.getElementById("p-desc").textContent=modos[m][1];
    document.getElementById("p-tab").innerHTML=tabela(modos[m][0](),"produto",tot,modos[m][2]);
  }
  document.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){mostra(b.getAttribute("data-m"));});});
  mostra("valor");
  document.getElementById("busca").addEventListener("input",function(e){
    var q=slug(e.target.value).replace(/-/g," ").trim(), box=document.getElementById("p-busca");
    if(q.length<2){box.innerHTML="";return;}
    var rs=ps.filter(function(r){return slug((r.curto||"")+" "+r.nome).replace(/-/g," ").indexOf(q)>=0||String(r.codigo).indexOf(q)===0;}).slice(0,15);
    box.innerHTML=rs.length?tabela(rs,"produto",tot,"valor"):'<p class="small">Nenhum produto encontrado.</p>';
  });
}
V.exportacao=function(){paginaFluxo("export");};
V.importacao=function(){paginaFluxo("import");};

function paginaLista(tipo,chave,titulo,texto){
  var h='<div class="card"><span class="eyebrow">'+titulo+' · '+mesNome(REF)+'</span><h1>'+titulo+'</h1><p class="lede">'+texto+'</p></div><div class="two">';
  ["export","import"].forEach(function(fl){
    var tot=fl==="export"?EXP:IMP;
    h+='<div class="card"><h2>'+(fl==="export"?(tipo==="pais"?"Destinos das exportações":"Exportações por estado"):(tipo==="pais"?"Origens das importações":"Importações por estado"))+'</h2>'+tabela(lista(chave,fl).filter(function(r){return r.fob>0;}).slice(0,30),tipo,tot,"valor")+'</div>';
  });
  app.innerHTML=h+'</div>';
}
V.paises=function(){paginaLista("pais","paises","Países","Para quem o Brasil vende e de quem compra. Toque em um país para ver o comércio bilateral.");};
V.estados=function(){paginaLista("estado","estados","Estados","Quanto cada estado exporta e importa. Toque em um estado para ver os números.");};

function acha(chave,s,porCodigo){
  var out={};["export","import"].forEach(function(fl){out[fl]=lista(chave,fl).filter(function(r){return (porCodigo?slug(r.codigo):slug(r.nome))===s;})[0]||null;});
  return out;
}
function rank(chave,fl,r){if(!r)return null;var l=lista(chave,fl);return l.indexOf(r)+1;}
function paginaItem(tipo,s){
  var chave=tipo==="produto"?"produtos":tipo==="pais"?"paises":"estados";
  var it=acha(chave,s,tipo==="produto"), e=it.export, i=it.import;
  if(!e&&!i){app.innerHTML='<div class="card"><h1>Não encontrado</h1><p><a href="#inicio">Voltar ao início</a></p></div>';return;}
  var nome=(e||i).curto||(e||i).nome, oficial=(e||i).nome, cod=(e||i).codigo;
  var E=e?e.fob:0,E0=e?e.fob_ant:0,I=i?i.fob:0,I0=i?i.fob_ant:0;
  var rotTipo=tipo==="produto"?"Produto · SH4 "+esc(cod):tipo==="pais"?"País":"Estado";
  var h='<div class="card"><span class="eyebrow">'+rotTipo+'</span><h1>'+esc(nome)+'</h1>'+(tipo==="produto"&&oficial!==nome?'<p class="small">Nome oficial: '+esc(oficial)+'</p>':'');
  var frases=[];
  if(tipo==="produto"){
    if(E>0||E0>0)frases.push('O Brasil exportou <strong class="num">'+us(E)+'</strong> em '+mesNome(REF)+(E0?', '+(E>=E0?'alta':'queda')+' de '+nf(Math.abs(pct(E,E0)),1)+'% sobre um ano antes':'')+'. É o '+rank(chave,"export",e)+'º produto da pauta de exportação no mês.');
    if(I>0||I0>0)frases.push('As importações somaram <strong class="num">'+us(I)+'</strong>'+(I0?' ('+(I>=I0?'+':'−')+nf(Math.abs(pct(I,I0)),1)+'%)':'')+'.');
  }else{
    var de=tipo==="pais"?"para":"de";
    frases.push('Em '+mesNome(REF)+', as exportações '+(tipo==="pais"?'para '+esc(nome):'do estado')+' somaram <strong class="num">'+us(E)+'</strong>'+(E0?' ('+(E>=E0?'+':'−')+nf(Math.abs(pct(E,E0)),1)+'%)':'')+' e as importações, <strong class="num">'+us(I)+'</strong>'+(I0?' ('+(I>=I0?'+':'−')+nf(Math.abs(pct(I,I0)),1)+'%)':'')+'. O saldo foi de <strong class="num">'+us(E-I)+'</strong>.');
    if(e)frases.push((tipo==="pais"?'É o '+rank(chave,"export",e)+'º maior destino das exportações brasileiras, com ':'É o '+rank(chave,"export",e)+'º estado exportador, com ')+nf(E/EXP*100,1)+'% do total.');
  }
  h+='<p class="lede">'+frases.join(' ')+'</p></div>';
  h+='<div class="tiles">'+tile("exp","Exportações",us(E).replace("US$ ",""),"US$",chip(E,E0))+tile("imp","Importações",us(I).replace("US$ ",""),"US$",chip(I,I0))+tile("bal","Saldo",us(E-I).replace("US$ ",""),"US$",'<span class="chg flat">antes '+us(E0-I0).replace("US$ ","")+'</span>');
  if(tipo==="produto"&&e&&e.kg>0){
    var pr=E/e.kg*1000, pr0=e.kg_ant?E0/e.kg_ant*1000:0;
    h+=tile("","Preço médio exportado",nf(pr,0),"US$/t",pr0?chip(pr,pr0):'<span class="chg flat">—</span>');
  }else{
    h+=tile("","Corrente de comércio",us(E+I).replace("US$ ",""),"US$",chip(E+I,E0+I0));
  }
  h+='</div>';
  h+='<div class="card"><div class="row-head"><h2>'+cap(mesNome(REF))+' contra '+mesNome(ANT)+'</h2><div class="legend"><span><i style="background:var(--exp)"></i>Exportação</span><span><i style="background:var(--imp)"></i>Importação</span></div></div><div class="chart" id="g-par" role="img" aria-label="Comparação de exportações e importações entre os dois meses"></div>';
  if(tipo==="produto"&&e&&e.kg>0&&e.kg_ant>0){
    var qv=pct(e.kg,e.kg_ant), pv=pct(E/e.kg,E0/e.kg_ant);
    h+='<p class="small">Na exportação, a quantidade embarcada variou '+(qv>=0?'+':'−')+nf(Math.abs(qv),1)+'% ('+nf(e.kg/1e6,1)+' mil toneladas) e o preço médio, '+(pv>=0?'+':'−')+nf(Math.abs(pv),1)+'%.</p>';
  }
  h+='</div>';
  h+='<div class="card"><h2>Em breve nesta página</h2><ul class="plain">'+(tipo==="produto"?'<li>Série mensal desde 1997, em valor e em volume.</li><li>Países que mais compram e estados que mais embarcam este produto.</li>':tipo==="pais"?'<li>Produtos que o Brasil mais vende e mais compra deste país.</li><li>Série mensal desde 1997.</li>':'<li>Produtos que o estado mais exporta e importa.</li><li>Principais destinos e série mensal desde 1997.</li>')+'<li>Alerta por e-mail quando houver variação forte.</li></ul></div>';
  app.innerHTML=h;
  grafPar(document.getElementById("g-par"),[mesCurto(ANT),mesCurto(REF)],[[E0,E,"var(--exp)"],[I0,I,"var(--imp)"]],function(v){return us(v).replace("US$ ","");});
}

V.sobre=function(){
  var np=lista("produtos","export").filter(function(r){return r.fob>0;}).length, ni=lista("produtos","import").filter(function(r){return r.fob>0;}).length;
  var npais=lista("paises","export").filter(function(r){return r.fob>0;}).length;
  app.innerHTML='<div class="card"><span class="eyebrow">Como funciona</span><h1>O Comex Stat, sem precisar saber código NCM</h1><p class="lede">Os dados oficiais de comércio exterior do Brasil são públicos e gratuitos, mas difíceis de consultar. O Comex em Números busca cada atualização mensal do MDIC e transforma em páginas prontas, com nomes que as pessoas procuram.</p></div>'+
  '<div class="two"><div class="card"><h2>Neste mês</h2><table><tbody><tr><td>Produtos exportados (SH4)</td><td class="r">'+nf(np,0)+'</td></tr><tr><td>Produtos importados (SH4)</td><td class="r">'+nf(ni,0)+'</td></tr><tr><td>Países de destino</td><td class="r">'+nf(npais,0)+'</td></tr><tr><td>Estados</td><td class="r">'+lista("estados","export").filter(function(r){return r.fob>0;}).length+'</td></tr></tbody></table></div>'+
  '<div class="card"><h2>Fonte e método</h2><ul class="plain"><li>Fonte: API do Comex Stat, Secex/MDIC. Valores em US$ FOB.</li><li>Atualização automática no início de cada mês, quando o MDIC publica o mês anterior.</li><li>Variações sempre contra o mesmo mês do ano anterior.</li><li>Produtos na classificação SH4 (posição do Sistema Harmonizado).</li><li>Estado: UF de origem do produto exportado e de destino do importado.</li></ul></div></div>';
};

// ---------- rotas ----------
function rota(){
  var h=(location.hash||"").replace("#","")||"inicio", m;
  var ativo=h;
  if(V[h]){V[h]();}
  else if((m=h.match(/^produto-(.+)$/))){paginaItem("produto",m[1]);ativo=null;}
  else if((m=h.match(/^pais-(.+)$/))){paginaItem("pais",m[1]);ativo="paises";}
  else if((m=h.match(/^estado-(.+)$/))){paginaItem("estado",m[1]);ativo="estados";}
  else {V.inicio();ativo="inicio";}
  document.querySelectorAll("nav.main a").forEach(function(a){if(a.getAttribute("data-v")===ativo)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",rota);
rota();
})();
</script>
